<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Γλωσσάρι Όρων — Ασφαλής &amp; Ηθική Χρήση της ΤΝ</title>
<style>
  :root{
    --teal:#028090;
    --seafoam:#00A896;
    --mint:#02C39A;
    --dark:#0B2E33;
    --offwhite:#F4F9F9;
    --text-dark:#16292B;
    --muted:#5A6E70;
    --line:#DCE7E7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--offwhite);
    color:var(--text-dark);
    font-family:Calibri,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.5;
  }
  header{
    background:var(--dark);
    padding:2.4rem 1.5rem 2rem;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;
    top:-70px; right:-60px;
    width:220px; height:220px;
    border-radius:50%;
    background:var(--teal);
    opacity:.35;
  }
  header::after{
    content:"";
    position:absolute;
    bottom:-90px; left:-70px;
    width:200px; height:200px;
    border-radius:50%;
    background:var(--seafoam);
    opacity:.22;
  }
  .eyebrow{
    color:var(--mint);
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.14em;
    position:relative;
    z-index:1;
  }
  h1{
    font-family:Cambria,Georgia,serif;
    color:#fff;
    font-size:2rem;
    margin:.5rem 0 .3rem;
    position:relative;
    z-index:1;
    max-width:640px;
  }
  header p{
    color:#CFE3E3;
    font-style:italic;
    font-size:.95rem;
    margin:0;
    position:relative;
    z-index:1;
    max-width:560px;
  }

  .controls{
    position:sticky;
    top:0;
    background:var(--offwhite);
    z-index:5;
    padding:1rem 1.5rem .8rem;
    border-bottom:1px solid var(--line);
  }
  .search-wrap{
    max-width:900px;
    margin:0 auto .7rem;
  }
  #search{
    width:100%;
    padding:.7rem 1rem;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:1rem;
    font-family:inherit;
    color:var(--text-dark);
    background:#fff;
  }
  #search:focus{
    outline:none;
    border-color:var(--teal);
  }
  .chips{
    max-width:900px;
    margin:0 auto;
    display:flex;
    gap:.5rem;
    overflow-x:auto;
    padding-bottom:.2rem;
  }
  .chip{
    flex:0 0 auto;
    padding:.4rem .9rem;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--muted);
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s,border-color .15s,color .15s;
  }
  .chip:hover{ border-color:var(--seafoam); }
  .chip.active{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:1rem 1.5rem 3rem;
  }
  .count{
    color:var(--muted);
    font-size:.85rem;
    margin:.8rem 0 .4rem;
  }
  .entry{
    border-bottom:1px solid var(--line);
  }
  .entry-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:1rem;
    padding:1rem 0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .entry-title{
    display:flex;
    align-items:baseline;
    gap:.7rem;
    flex-wrap:wrap;
  }
  .entry-term{
    font-family:Cambria,Georgia,serif;
    font-weight:700;
    font-size:1.15rem;
    color:var(--text-dark);
  }
  .entry-tag{
    font-size:.72rem;
    font-weight:700;
    color:var(--teal);
    border:1px solid var(--teal);
    border-radius:999px;
    padding:.12rem .55rem;
    white-space:nowrap;
  }
  .chevron{
    color:var(--seafoam);
    font-size:1.1rem;
    transition:transform .2s;
    flex:0 0 auto;
  }
  .entry.open .chevron{ transform:rotate(180deg); }
  .entry-def{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .entry-def-inner{
    padding:0 0 1.1rem;
    color:var(--text-dark);
    font-size:.96rem;
    max-width:70ch;
  }
  .no-results{
    display:none;
    color:var(--muted);
    font-style:italic;
    padding:2rem 0;
    text-align:center;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.78rem;
    padding:1.5rem;
  }
  @media (max-width:560px){
    h1{ font-size:1.5rem; }
    .entry-term{ font-size:1.02rem; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">ΓΛΩΣΣΑΡΙ ΟΡΩΝ</div>
  <h1>Ασφαλής &amp; Ηθική Χρήση της ΤΝ</h1>
  <p>Όλοι οι βασικοί όροι του σεμιναρίου, σε ένα σημείο — πάτα σε έναν όρο για τον ορισμό του.</p>
</header>

<div class="controls">
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Αναζήτησε έναν όρο…" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</div>

<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
  <div class="no-results" id="noResults">Δεν βρέθηκε όρος που να ταιριάζει.</div>
</main>

<footer>ΑΚΕΘ / ΙΝΕΚΑ &middot; Ασφαλής &amp; Ηθική Χρήση της ΤΝ</footer>

<script>
const modules = [
  "Ενότητα 1", "Ενότητα 2", "Ενότητα 3",
  "Ενότητα 4", "Ενότητα 5", "Ενότητα 6"
];

const terms = [
  { term:"AI Literacy", module:"Ενότητα 6",
    def:"Η υποχρέωση, βάσει του EU AI Act, οργανισμοί που χρησιμοποιούν ΤΝ να διασφαλίζουν επαρκές επίπεδο κατανόησης ΤΝ στο προσωπικό τους. Ισχύει ήδη από τον Φεβρουάριο του 2025." },
  { term:"AI-Generated Περιεχόμενο", module:"Ενότητα 4",
    def:"Εικόνα, ήχος, βίντεο, ή κείμενο που δημιουργήθηκε από εργαλείο τεχνητής νοημοσύνης, όχι απευθείας από άνθρωπο." },
  { term:"Αλγοριθμική Μεροληψία (Bias)", module:"Ενότητα 3",
    def:"Όταν ένα σύστημα ΤΝ αντιμετωπίζει άδικα συγκεκριμένες ομάδες ανθρώπων, επειδή αναπαράγει προκαταλήψεις που υπήρχαν στα δεδομένα πάνω στα οποία εκπαιδεύτηκε." },
  { term:"Ανωνυμοποίηση", module:"Ενότητα 2",
    def:"Η τεχνική αντικατάστασης στοιχείων ταυτοποίησης (όνομα, διεύθυνση, ηλικία) με γενικές περιγραφές, ώστε να προστατεύεται η ταυτότητα ενός ατόμου όταν ζητάς βοήθεια από εργαλείο ΤΝ." },
  { term:"Δικαίωμα στη Λήθη", module:"Ενότητα 2",
    def:"Ένα από τα βασικά δικαιώματα του GDPR: το δικαίωμα να ζητήσεις τη διαγραφή των προσωπικών σου δεδομένων από έναν οργανισμό, σε πολλές περιπτώσεις." },
  { term:"Deepfake", module:"Ενότητα 4",
    def:"Περιεχόμενο —συνήθως βίντεο ή ήχος— που δημιουργείται ή τροποποιείται με ΤΝ ώστε να δείχνει κάποιον να λέει ή να κάνει κάτι που στην πραγματικότητα δεν συνέβη." },
  { term:"Disinformation (Σκόπιμη Παραπλάνηση)", module:"Ενότητα 5",
    def:"Λανθασμένη πληροφορία που διαδίδεται εν γνώσει ότι είναι ψευδής, συνήθως για συγκεκριμένο όφελος — οικονομικό, πολιτικό, ή άλλο." },
  { term:"EU AI Act", module:"Ενότητα 6",
    def:"Ο πρώτος ολοκληρωμένος νόμος στον κόσμο ειδικά για την τεχνητή νοημοσύνη. Ισχύει σε όλη την ΕΕ και κατατάσσει τα συστήματα ΤΝ σε κατηγορίες ανάλογα με το επίπεδο κινδύνου τους." },
  { term:"Fact-Checking", module:"Ενότητα 5",
    def:"Η συστηματική διαδικασία επαλήθευσης αν ένας ισχυρισμός ή μια είδηση είναι αληθής, πριν τον εμπιστευτείς ή τον μοιραστείς." },
  { term:"GDPR", module:"Ενότητα 2",
    def:"Ο Γενικός Κανονισμός Προστασίας Δεδομένων — ο ευρωπαϊκός νόμος που καθορίζει πώς πρέπει να προστατεύονται τα προσωπικά δεδομένα των πολιτών, ανεξάρτητα από το πού εδρεύει η εταιρεία που τα επεξεργάζεται." },
  { term:"Generative AI (Παραγωγική ΤΝ)", module:"Ενότητα 1",
    def:"Τεχνητή νοημοσύνη που δημιουργεί νέο περιεχόμενο —κείμενο, εικόνα, ήχο— αντί απλά να αναλύει ή να ταξινομεί υπάρχον περιεχόμενο." },
  { term:"Hallucination", module:"Ενότητα 1",
    def:"Όταν ένα εργαλείο ΤΝ παράγει πληροφορία που ακούγεται εύλογη και σίγουρη, αλλά είναι εντελώς λανθασμένη ή εφευρημένη." },
  { term:"Lateral Reading (Πλάγια Ανάγνωση)", module:"Ενότητα 5",
    def:"Η τεχνική ελέγχου μιας πηγής ανοίγοντας νέες καρτέλες για να δεις τι λένε ανεξάρτητες πηγές γι' αυτήν — αντί να διαβάζεις προσεκτικά μόνο την ίδια τη σελίδα." },
  { term:"LLM (Γλωσσικό Μοντέλο)", module:"Ενότητα 1",
    def:"Large Language Model. Ένα σύστημα ΤΝ εκπαιδευμένο σε τεράστιες ποσότητες κειμένου, που παράγει απαντήσεις προβλέποντας κάθε φορά την πιο πιθανή επόμενη λέξη." },
  { term:"Misinformation (Λανθασμένη Πληροφορία)", module:"Ενότητα 5",
    def:"Πληροφορία που είναι λανθασμένη, αλλά όποιος τη μοιράζεται δεν ξέρει ότι είναι λάθος — την πιστεύει ειλικρινά αληθινή." },
  { term:"Προσωπικά Δεδομένα", module:"Ενότητα 2",
    def:"Κάθε πληροφορία που αφορά ταυτοποιημένο ή ταυτοποιήσιμο φυσικό πρόσωπο — όνομα, email, φωτογραφία, ακόμα και IP διεύθυνση." },
  { term:"Token", module:"Ενότητα 1",
    def:"Η μικρότερη μονάδα κειμένου —μια λέξη ή κομμάτι λέξης— που \u201Cδιαβάζει\u201D και επεξεργάζεται ένα γλωσσικό μοντέλο." },
  { term:"Υψηλού Κινδύνου Σύστημα ΤΝ", module:"Ενότητα 6",
    def:"Κατηγορία του EU AI Act για συστήματα ΤΝ σε ευαίσθητους τομείς (υγεία, εκπαίδευση, απασχόληση, αστυνόμευση) — επιτρέπονται, αλλά με αυστηρές υποχρεώσεις διαφάνειας και ελέγχου." }
];

terms.sort((a,b)=> a.term.localeCompare(b.term,'el'));

const chipsEl = document.getElementById('chips');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const noResultsEl = document.getElementById('noResults');
const searchEl = document.getElementById('search');

let activeModule = "Όλες";

function renderChips(){
  const all = ["Όλες", ...modules];
  chipsEl.innerHTML = all.map(m =>
    `<button class="chip${m===activeModule?' active':''}" data-mod="${m}">${m}</button>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeModule = btn.dataset.mod;
      renderChips();
      renderList();
    });
  });
}

function renderList(){
  const q = searchEl.value.trim().toLowerCase();
  const filtered = terms.filter(t=>{
    const matchesModule = activeModule==="Όλες" || t.module===activeModule;
    const matchesSearch = !q || t.term.toLowerCase().includes(q) || t.def.toLowerCase().includes(q);
    return matchesModule && matchesSearch;
  });

  countEl.textContent = filtered.length + (filtered.length===1 ? " όρος" : " όροι");
  noResultsEl.style.display = filtered.length===0 ? 'block' : 'none';

  listEl.innerHTML = filtered.map((t,i)=>`
    <div class="entry" data-idx="${i}">
      <div class="entry-head">
        <div class="entry-title">
          <span class="entry-term">${t.term}</span>
          <span class="entry-tag">${t.module}</span>
        </div>
        <span class="chevron">&#9662;</span>
      </div>
      <div class="entry-def"><div class="entry-def-inner">${t.def}</div></div>
    </div>
  `).join('');

  listEl.querySelectorAll('.entry').forEach(entry=>{
    const head = entry.querySelector('.entry-head');
    const def = entry.querySelector('.entry-def');
    head.addEventListener('click', ()=>{
      const isOpen = entry.classList.contains('open');
      if(isOpen){
        def.style.maxHeight = null;
        entry.classList.remove('open');
      } else {
        entry.classList.add('open');
        def.style.maxHeight = def.scrollHeight + "px";
      }
    });
  });
}

searchEl.addEventListener('input', renderList);

renderChips();
renderList();
</script>

</body>
</html>
